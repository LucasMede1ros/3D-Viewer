<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Visualizador 3D</title>

    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#191919">
    <link rel="icon" href="data:,">

    <!-- Antecipação das conexões usadas no caminho crítico. -->
    <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://drivers.pichau.com.br" crossorigin>
    <link rel="dns-prefetch" href="//ajax.googleapis.com">
    <link rel="dns-prefetch" href="//www.gstatic.com">
    <link rel="dns-prefetch" href="//drivers.pichau.com.br">

    <!--
        O módulo é descoberto imediatamente, enquanto o GLB continua com prioridade alta.
        O navegador pode baixar ambos em paralelo.
    -->
    <link
        rel="modulepreload"
        href="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
        crossorigin="anonymous">

    <!--
        O transcoder KTX2 é necessário para todos os modelos deste projeto.
        A prioridade baixa evita competir com o GLB principal.
    -->
    <link
        rel="preload"
        href="https://www.gstatic.com/basis-universal/versioned/2021-04-15-ba1c3e4/basis_transcoder.wasm"
        as="fetch"
        type="application/wasm"
        crossorigin="anonymous"
        fetchpriority="low">

    <script>
        self.ModelViewerElement = self.ModelViewerElement || {};
        self.ModelViewerElement.ktx2TranscoderLocation =
            "https://www.gstatic.com/basis-universal/versioned/2021-04-15-ba1c3e4/";
        self.ModelViewerElement.powerPreference = "high-performance";
    </script>

    <!--
        Inicia o download do GLB antes de o HTML terminar de ser analisado.
        A URL validada é reutilizada no script principal.
    -->
    <script>
        (() => {
            "use strict";

            const model = new URLSearchParams(window.location.search).get("model");

            if (typeof model !== "string") {
                return;
            }

            const arquivo = model.trim();
            const arquivoValido =
                arquivo.length > 0 &&
                arquivo.toLowerCase().endsWith(".glb") &&
                !arquivo.includes("..") &&
                !arquivo.includes("/") &&
                !arquivo.includes("\\") &&
                !arquivo.includes("\0");

            if (!arquivoValido) {
                return;
            }

            try {
                const glbUrl = new URL("./" + arquivo, window.location.href);

                window.__viewer3DGlbUrl = glbUrl.href;
                window.__viewer3DModelName = arquivo;

                const preload = document.createElement("link");
                preload.rel = "preload";
                preload.as = "fetch";
                preload.type = "model/gltf-binary";
                preload.href = glbUrl.href;
                preload.crossOrigin = "anonymous";
                preload.fetchPriority = "high";

                document.head.appendChild(preload);
            } catch (error) {
                console.warn("Não foi possível iniciar o preload do modelo 3D:", error);
            }
        })();
    </script>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
        crossorigin="anonymous">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #191919;
            font-family: Poppins, Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            overscroll-behavior: none;
        }

        model-viewer {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            contain: strict;
            background: #191919;
            border: 0;
            outline: 0;

            --poster-color: #191919;
            --progress-bar-color: transparent;
            --progress-bar-height: 0;
        }

        #posterLayer {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            padding: 40px;
            background: #191919;
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            transition: opacity 120ms ease, visibility 120ms ease;
        }

        #posterLayer.oculto {
            opacity: 0;
            visibility: hidden;
        }

        #posterImg {
            display: block;
            width: auto;
            height: auto;
            max-width: 80vw;
            max-height: 70vh;
            max-height: 70svh;
            margin-bottom: 28px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        #progressWrap {
            position: relative;
            width: min(320px, 70vw);
            height: 6px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #d43043;
            border-radius: 999px;
            transition: width 100ms linear;
            will-change: width;
        }

        #progressWrap.indeterminado #progressBar {
            width: 35%;
            animation: progresso-indeterminado 1.1s ease-in-out infinite;
        }

        #progressTexto {
            margin-top: 10px;
            color: #cccccc;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        #erro {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            padding: 30px;
            background: #191919;
            color: #ffffff;
            font-size: 18px;
            line-height: 1.5;
            text-align: center;
        }

        #erro.visivel {
            display: flex;
        }

        #fechar {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            right: calc(20px + env(safe-area-inset-right, 0px));
            z-index: 30;
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            background: #d43043;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            touch-action: manipulation;
            transition: background-color 0.2s ease, transform 0.12s ease;
        }

        #fechar:hover {
            background: #aa091c;
        }

        #fechar:active {
            transform: scale(0.97);
        }

        #fechar:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        @keyframes progresso-indeterminado {
            from {
                transform: translateX(-120%);
            }

            to {
                transform: translateX(340%);
            }
        }

        @media (max-width: 600px) {
            #posterLayer {
                padding:
                    calc(24px + env(safe-area-inset-top, 0px))
                    calc(24px + env(safe-area-inset-right, 0px))
                    calc(24px + env(safe-area-inset-bottom, 0px))
                    calc(24px + env(safe-area-inset-left, 0px));
            }

            #posterImg {
                max-width: 88vw;
                max-height: 55vh;
                max-height: 55svh;
            }

            #fechar {
                top: calc(12px + env(safe-area-inset-top, 0px));
                right: calc(12px + env(safe-area-inset-right, 0px));
                padding: 9px 14px;
                font-size: 13px;
            }

            #erro {
                padding:
                    calc(24px + env(safe-area-inset-top, 0px))
                    calc(24px + env(safe-area-inset-right, 0px))
                    calc(24px + env(safe-area-inset-bottom, 0px))
                    calc(24px + env(safe-area-inset-left, 0px));
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #posterLayer,
            #progressBar,
            #fechar {
                transition: none;
                animation: none;
            }
        }
    </style>
</head>

<body>
    <button
        id="fechar"
        type="button"
        aria-label="Fechar visualizador 3D">
        Fechar
    </button>

    <div id="posterLayer" aria-hidden="true">
        <img
            id="posterImg"
            src="https://drivers.pichau.com.br/pichaugaming/Banner/Design-Lab-White.png"
            alt="Pichau Design Lab"
            decoding="async"
            fetchpriority="low"
            draggable="false">

        <div
            id="progressWrap"
            class="indeterminado"
            role="progressbar"
            aria-label="Carregando modelo 3D"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0">
            <div id="progressBar"></div>
        </div>

        <div id="progressTexto" aria-live="polite">
            Iniciando visualização 3D...
        </div>
    </div>

    <div id="erro" role="alert" aria-live="assertive" tabindex="-1">
        Não foi possível carregar o modelo 3D.
    </div>

    <model-viewer
        id="viewer"
        alt="Visualização 3D do produto"
        camera-controls
        auto-rotate-delay="0"
        rotation-per-second="15deg"
        exposure="1"
        interaction-prompt="none"
        loading="eager"
        reveal="auto"
        minimum-render-scale="0.35"
        disable-pan>
    </model-viewer>

    <script>
        (() => {
            "use strict";

            const params = new URLSearchParams(window.location.search);
            const model = params.get("model");
            const poster = params.get("poster");
            const alt = params.get("alt");
            const autoRotate = params.get("autorotate") !== "false";

            const viewer = document.getElementById("viewer");
            const posterLayer = document.getElementById("posterLayer");
            const posterImg = document.getElementById("posterImg");
            const progressWrap = document.getElementById("progressWrap");
            const progressBar = document.getElementById("progressBar");
            const progressTexto = document.getElementById("progressTexto");
            const erro = document.getElementById("erro");
            const fechar = document.getElementById("fechar");

            const parentOrigin = "https://pichaugaming.com.br";
            const fallbackUrl = "https://pichaugaming.com.br";
            const tempoMaximoCarregamento = 90000;
            const tempoMaximoBiblioteca = 20000;

            let carregado = false;
            let erroExibido = false;
            let contextRecuperado = false;
            let timeoutCarregamento = null;
            let timeoutBiblioteca = null;
            let ultimoPercentual = -1;
            let posterOcultado = false;

            const chaveRecuperacaoWebGL =
                "viewer3d-reload-" + (model || "sem-modelo");

            function modeloValido(nome) {
                if (typeof nome !== "string") {
                    return false;
                }

                const arquivo = nome.trim();

                return (
                    arquivo.length > 0 &&
                    arquivo.toLowerCase().endsWith(".glb") &&
                    !arquivo.includes("..") &&
                    !arquivo.includes("/") &&
                    !arquivo.includes("\\") &&
                    !arquivo.includes("\0")
                );
            }

            function obterUrlModelo() {
                if (window.__viewer3DGlbUrl) {
                    try {
                        return new URL(window.__viewer3DGlbUrl);
                    } catch (error) {
                        console.warn("URL antecipada do modelo inválida:", error);
                    }
                }

                if (!modeloValido(model)) {
                    return null;
                }

                try {
                    return new URL("./" + model.trim(), window.location.href);
                } catch (error) {
                    console.error("Não foi possível montar a URL do modelo:", error);
                    return null;
                }
            }

            function avisarParent(action) {
                if (window.parent === window) {
                    return;
                }

                window.parent.postMessage(
                    {
                        type: "viewer3d",
                        action
                    },
                    parentOrigin
                );
            }

            function limparTimeouts() {
                if (timeoutCarregamento !== null) {
                    window.clearTimeout(timeoutCarregamento);
                    timeoutCarregamento = null;
                }

                if (timeoutBiblioteca !== null) {
                    window.clearTimeout(timeoutBiblioteca);
                    timeoutBiblioteca = null;
                }
            }

            function esconderPoster() {
                if (posterOcultado) {
                    return;
                }

                posterOcultado = true;
                posterLayer.classList.add("oculto");

                window.setTimeout(() => {
                    posterLayer.hidden = true;
                }, 140);
            }

            function executarQuandoOcioso(callback, timeout = 700) {
                if ("requestIdleCallback" in window) {
                    window.requestIdleCallback(callback, { timeout });
                    return;
                }

                window.setTimeout(callback, 0);
            }

            function ativarEfeitosDepoisDoPrimeiroFrame() {
                executarQuandoOcioso(() => {
                    if (!viewer.isConnected || erroExibido) {
                        return;
                    }

                    viewer.shadowIntensity = 1;
                    viewer.shadowSoftness = 1;

                    if (autoRotate) {
                        viewer.setAttribute("auto-rotate", "");
                    }
                });
            }

            function mostrarErro(mensagem) {
                if (erroExibido) {
                    return;
                }

                erroExibido = true;
                limparTimeouts();

                posterLayer.hidden = true;
                viewer.hidden = true;
                erro.textContent = mensagem || "Não foi possível carregar o modelo 3D.";
                erro.classList.add("visivel");
                erro.focus({ preventScroll: true });
            }

            function aplicarPoster() {
                if (!poster) {
                    return;
                }

                try {
                    const posterUrl = new URL(poster, window.location.href);

                    if (
                        posterUrl.protocol === "https:" ||
                        posterUrl.protocol === "http:"
                    ) {
                        posterImg.src = posterUrl.href;
                    }
                } catch (error) {
                    console.warn("URL do poster inválida:", error);
                }
            }

            function aplicarAlt() {
                if (!alt || !alt.trim()) {
                    return;
                }

                const textoAlt = alt.trim();
                viewer.setAttribute("alt", textoAlt);
                posterImg.setAttribute("alt", textoAlt);
            }

            function atualizarProgresso(fracao, finalizado = false) {
                if (typeof fracao !== "number" || !Number.isFinite(fracao)) {
                    return;
                }

                progressWrap.classList.remove("indeterminado");

                let percentual = Math.round(fracao * 100);
                percentual = Math.max(0, Math.min(100, percentual));

                if (!finalizado) {
                    percentual = Math.min(99, percentual);
                }

                if (percentual === ultimoPercentual) {
                    return;
                }

                ultimoPercentual = percentual;
                progressBar.style.width = percentual + "%";
                progressBar.style.transform = "none";
                progressWrap.setAttribute("aria-valuenow", String(percentual));

                if (!finalizado && percentual >= 98) {
                    progressTexto.textContent = "Preparando visualização 3D...";
                    return;
                }

                progressTexto.textContent = finalizado
                    ? "Modelo 3D pronto"
                    : "Carregando modelo 3D... " + percentual + "%";
            }

            function iniciarTimeoutCarregamento() {
                timeoutCarregamento = window.setTimeout(() => {
                    if (!carregado) {
                        mostrarErro("O modelo 3D demorou muito para carregar.");
                    }
                }, tempoMaximoCarregamento);
            }

            function definirModelo() {
                const glbUrl = obterUrlModelo();

                if (!glbUrl) {
                    mostrarErro("Modelo 3D não encontrado.");
                    return false;
                }

                viewer.src = glbUrl.href;
                iniciarTimeoutCarregamento();
                return true;
            }

            function acompanharBiblioteca() {
                if (!("customElements" in window)) {
                    mostrarErro("Este navegador não possui suporte ao visualizador 3D.");
                    return;
                }

                timeoutBiblioteca = window.setTimeout(() => {
                    if (!customElements.get("model-viewer")) {
                        mostrarErro("Não foi possível iniciar o visualizador 3D.");
                    }
                }, tempoMaximoBiblioteca);

                customElements
                    .whenDefined("model-viewer")
                    .then(() => {
                        if (timeoutBiblioteca !== null) {
                            window.clearTimeout(timeoutBiblioteca);
                            timeoutBiblioteca = null;
                        }
                    })
                    .catch(error => {
                        console.error("Não foi possível iniciar o model-viewer:", error);
                        mostrarErro("Não foi possível iniciar o visualizador 3D.");
                    });
            }

            function fecharVisualizador() {
                if (window.parent !== window) {
                    avisarParent("close");
                    return;
                }

                if (window.history.length > 1) {
                    window.history.back();
                    return;
                }

                window.location.href = fallbackUrl;
            }

            viewer.addEventListener(
                "load",
                () => {
                    carregado = true;
                    limparTimeouts();

                    try {
                        sessionStorage.removeItem(chaveRecuperacaoWebGL);
                    } catch (error) {
                        console.warn(
                            "Não foi possível limpar a recuperação WebGL:",
                            error
                        );
                    }

                    atualizarProgresso(1, true);

                    requestAnimationFrame(() => {
                        esconderPoster();
                        ativarEfeitosDepoisDoPrimeiroFrame();
                    });
                },
                { once: true }
            );

            viewer.addEventListener("error", event => {
                console.error("Erro do model-viewer ao carregar o GLB:", event);

                const tipoErro = event?.detail?.type;

                if (
                    tipoErro === "webglcontextlost" &&
                    !contextRecuperado
                ) {
                    let jaTentou = false;

                    try {
                        jaTentou =
                            sessionStorage.getItem(chaveRecuperacaoWebGL) === "1";
                    } catch (error) {
                        console.warn("sessionStorage indisponível:", error);
                    }

                    if (jaTentou) {
                        mostrarErro(
                            "Este dispositivo não tem memória suficiente para exibir este modelo 3D."
                        );
                        return;
                    }

                    contextRecuperado = true;

                    try {
                        sessionStorage.setItem(chaveRecuperacaoWebGL, "1");
                    } catch (error) {
                        console.warn(
                            "Não foi possível registrar a recuperação WebGL:",
                            error
                        );
                    }

                    window.setTimeout(() => {
                        window.location.reload();
                    }, 500);
                    return;
                }

                const detalhe =
                    event?.detail?.sourceError?.message ||
                    tipoErro ||
                    "";

                mostrarErro(
                    "Não foi possível carregar o modelo 3D." +
                    (detalhe ? " [" + detalhe + "]" : "")
                );
            });

            viewer.addEventListener("progress", event => {
                atualizarProgresso(event.detail?.totalProgress);
            });

            posterImg.addEventListener(
                "error",
                () => {
                    posterImg.hidden = true;
                },
                { once: true }
            );

            fechar.addEventListener("click", fecharVisualizador);

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    fecharVisualizador();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    viewer.removeAttribute("auto-rotate");
                    return;
                }

                if (carregado && autoRotate) {
                    executarQuandoOcioso(() => {
                        viewer.setAttribute("auto-rotate", "");
                    }, 300);
                }
            });

            aplicarPoster();
            aplicarAlt();
            avisarParent("open");

            if (definirModelo()) {
                acompanharBiblioteca();
            }
        })();
    </script>
</body>
</html>
